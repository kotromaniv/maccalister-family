<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maccalister Family — Активні користувачі</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="crest" data-crest></div>
      <span>MACCALISTER FAMILY — АДМІНПАНЕЛЬ</span>
    </div>
    <div class="topbar-user">
      <a href="dashboard.html">← Кабінет</a>
      <button class="btn-danger" id="logoutBtn">Вийти</button>
    </div>
  </div>

  <div class="main">
    <div class="eyebrow">Контроль доступу</div>
    <h1 style="font-size: 24px;">Активні сесії</h1>
    <p style="color: var(--ink-muted); font-size: 14px;">Оновлюється автоматично кожні 5 секунд.</p>

    <div class="table-wrap" style="margin-top: 20px;">
      <table>
        <thead>
          <tr>
            <th>Логін</th>
            <th>Роль</th>
            <th>IP</th>
            <th>Браузер</th>
            <th>ОС / Пристрій</th>
            <th>Вхід</th>
            <th>Остання активність</th>
            <th>Статус</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sessionsBody">
          <tr><td colspan="9" style="color: var(--ink-faint);">Завантаження...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="crest-divider">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 L14 9 L21 9 L15.5 13.5 L17.5 21 L12 16.5 L6.5 21 L8.5 13.5 L3 9 L10 9 Z"/></svg>
      журнал подій
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 L14 9 L21 9 L15.5 13.5 L17.5 21 L12 16.5 L6.5 21 L8.5 13.5 L3 9 L10 9 Z"/></svg>
    </div>

    <h2 style="font-size: 18px;">Останні події</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Час</th>
            <th>Логін</th>
            <th>Подія</th>
            <th>IP</th>
            <th>Браузер</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr><td colspan="6" style="color: var(--ink-faint);">Завантаження...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
